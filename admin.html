<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Nyirikamera</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-orange-600 flex items-center justify-center shadow-lg shadow-orange-600/30">
                    <i class="fa-solid fa-gauge text-white text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-white">NYIRIKAMERA ADMIN</span>
                    <span class="block text-xs text-orange-500 font-semibold tracking-widest uppercase">Inventory Management</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm font-medium text-white transition flex items-center space-x-2">
                    <i class="fa-solid fa-store"></i>
                    <span>View Storefront</span>
                </a>
                <button onclick="resetDefaultStock()" class="px-4 py-2 rounded-xl bg-orange-600 hover:bg-orange-500 text-sm font-bold text-white transition shadow-lg shadow-orange-600/20">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Reset 50 Items
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Add / Edit Form -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit sticky top-6">
                <h2 id="form-title" class="text-lg font-bold text-white mb-6 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-orange-500"></i>
                    <span>Add New Equipment</span>
                </h2>
                <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
                    <input type="hidden" id="item-id">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Product Title</label>
                        <input type="text" id="title" required placeholder="e.g. Sony FX3 Cinema Line" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Category</label>
                        <select id="category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                            <option value="photography">Photography</option>
                            <option value="videography">Videography</option>
                            <option value="audio">Pro Audio</option>
                            <option value="lighting">Lighting</option>
                            <option value="computer">Computers & Tech</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Purchase Price</label>
                            <input type="text" id="price" required placeholder="2,400,000 RWF" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Rental Price</label>
                            <input type="text" id="rentalPrice" placeholder="60,000 RWF / day" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Badge Tag</label>
                            <input type="text" id="discount" placeholder="Best Seller" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">FontAwesome Icon</label>
                            <input type="text" id="icon" placeholder="fa-camera" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider">Key Features Description</label>
                        <textarea id="features" rows="3" placeholder="Full-frame sensor, 4K 60p..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-orange-500"></textarea>
                    </div>
                    <div class="flex space-x-3 pt-2">
                        <button type="submit" class="flex-grow py-3.5 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold text-sm transition shadow-lg shadow-orange-600/20">Save Item</button>
                        <button type="button" onclick="resetForm()" class="px-4 py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-sm transition">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Inventory List Table -->
            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i class="fa-solid fa-boxes-stacked text-orange-500"></i>
                        <span>Current Stock Catalog (<span id="total-count">0</span> items)</span>
                    </h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase">
                                <th class="pb-3 px-3">Item</th>
                                <th class="pb-3 px-3">Category</th>
                                <th class="pb-3 px-3">Price</th>
                                <th class="pb-3 px-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body" class="divide-y divide-slate-800/60 text-sm">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Nyirikamera Admin Dashboard</p>
    </footer>

        let products = JSON.parse(localStorage.getItem('nyirikamera_products')) || starter50Stock;

        function renderAdminTable() {
            const tbody = document.getElementById('admin-table-body');
            document.getElementById('total-count').innerText = products.length;
            tbody.innerHTML = '';

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="py-3 px-3">
                            <div class="font-bold text-white">${p.title}</div>
                            <div class="text-xs text-slate-500">${p.features}</div>
                        </td>
                        <td class="py-3 px-3">
                            <span class="px-2.5 py-1 rounded-md bg-slate-800 text-xs font-semibold text-slate-300 uppercase">${p.category}</span>
                        </td>
                        <td class="py-3 px-3">
                            <div class="font-semibold text-orange-400">${p.price}</div>
                            ${p.rentalPrice ? `<div class="text-xs text-slate-500">Rent: ${p.rentalPrice}</div>` : ''}
                        </td>
                        <td class="py-3 px-3 text-right space-x-2">
                            <button onclick="editItem(${p.id})" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteItem(${p.id})" class="p-2 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveItem(e) {
            e.preventDefault();
            const id = document.getElementById('item-id').value;
            const itemData = {
                id: id ? parseInt(id) : Date.now(),
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                rentalPrice: document.getElementById('rentalPrice').value,
                discount: document.getElementById('discount').value || 'In Stock',
                icon: document.getElementById('icon').value || 'fa-camera',
                features: document.getElementById('features').value
            };

            if (id) {
                const index = products.findIndex(p => p.id === parseInt(id));
                products[index] = itemData;
            } else {
                products.unshift(itemData);
            }

            localStorage.setItem('nyirikamera_products', JSON.stringify(products));
            resetForm();
            renderAdminTable();
        }

        function editItem(id) {
            const p = products.find(item => item.id === id);
            document.getElementById('item-id').value = p.id;
            document.getElementById('title').value = p.title;
            document.getElementById('category').value = p.category;
            document.getElementById('price').value = p.price;
            document.getElementById('rentalPrice').value = p.rentalPrice || '';
            document.getElementById('discount').value = p.discount || '';
            document.getElementById('icon').value = p.icon || '';
            document.getElementById('features').value = p.features || '';
            
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-orange-500"></i><span>Edit Equipment</span>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('nyirikamera_products', JSON.stringify(products));
                renderAdminTable();
            }
        }

        function resetForm() {
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = '';
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-circle-plus text-orange-500"></i><span>Add New Equipment</span>`;
        }

        function resetDefaultStock() {
            if (confirm('Reset catalog back to the default 50 items?')) {
                products = JSON.parse(JSON.stringify(starter50Stock));
                localStorage.setItem('nyirikamera_products', JSON.stringify(products));
                renderAdminTable();
            }
        }

        // Initialize
        renderAdminTable();
    </script>
</body>
