<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyirikamera — Professional Photography & Videography Gear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accent: '#f59e0b',
                        accentHover: '#d97706',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-yellow-300 flex items-center justify-center shadow-lg shadow-accent/20">
                    <i class="fa-solid fa-camera-retro text-black text-xl"></i>
                </div>
                <span class="text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-white via-gray-200 to-accent bg-clip-text text-transparent">
                    Nyirikamera
                </span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="https://wa.me/250782815825" target="_blank" 
                   class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-semibold text-sm flex items-center space-x-2 transition-all">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>WhatsApp Support</span>
                </a>
            </div>
        </div>
    </header>

    <!-- SHOP BY CATEGORY BAR -->
    <nav class="bg-gray-950 border-b border-gray-800 py-3">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-3 overflow-x-auto no-scrollbar">
            <button class="cat-pill active whitespace-nowrap bg-accent text-black px-4 py-1.5 rounded-full text-xs font-bold transition-all" data-category="all">All Gear</button>
            <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="photography">Photography</button>
            <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="videography">Videography</button>
            <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="audio">Pro Audio</button>
            <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="lighting">Lighting</button>
            <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="computer">Computers & Tech</button>
        </div>
    </nav>

    <!-- PRODUCTS GRID SECTION -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-2xl font-black uppercase tracking-wide text-white">Featured Equipment</h1>
            <button id="open-admin-btn" class="text-xs text-gray-500 hover:text-accent border border-gray-800 px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-lock mr-1"></i> Admin Panel
            </button>
        </div>

        <!-- Dynamic Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Items injected via main.js -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-darkBg border-t border-gray-800 py-10 mt-16 text-center text-sm text-gray-500">
        <p>© 2026 Nyirikamera E-Commerce. Kigali, Rwanda.</p>
    </footer>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-700 w-full max-w-2xl rounded-3xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-6">
                <h3 class="text-lg font-black text-white">Admin Management</h3>
                <button id="close-admin-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="add-product-form" class="space-y-4 mb-6 bg-gray-950 p-4 rounded-2xl border border-gray-800">
                <h4 class="text-accent font-bold text-xs uppercase">Add New Product</h4>
                <input type="text" id="p-title" required placeholder="Product Title (e.g. Sony a7 IV)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="p-price" required placeholder="Current Price (e.g. 2,400,000 RWF)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="p-oldprice" placeholder="Old Price (e.g. 2,500,000 RWF)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <select id="p-category" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="photography">Photography</option>
                        <option value="videography">Videography</option>
                        <option value="audio">Pro Audio</option>
                        <option value="lighting">Lighting</option>
                        <option value="computer">Computer</option>
                    </select>
                    <input type="text" id="p-discount" placeholder="Discount Tag (-5% new)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="p-stock" placeholder="Stock (e.g. 1 in Stock)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
                <button type="submit" class="w-full bg-accent text-black font-bold py-2.5 rounded-xl text-sm">Save & Publish</button>
            </form>
            <div id="admin-inventory-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
