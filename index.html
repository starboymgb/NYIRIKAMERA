<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyirikamera — Professional Photography, Videography & Event Packages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131c2e',
                        accent: '#f59e0b',
                        accentHover: '#d97706',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <div>
        <!-- HEADER -->
        <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-accent to-yellow-300 flex items-center justify-center shadow-lg shadow-accent/20">
                        <i class="fa-solid fa-camera-retro text-black text-xl"></i>
                    </div>
                    <span class="text-2xl font-black tracking-wider uppercase bg-gradient-to-r from-white via-gray-200 to-accent bg-clip-text text-transparent">
                        Nyirikamera
                    </span>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="https://wa.me/250782815825" target="_blank" 
                       class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-semibold text-sm flex items-center space-x-2 transition-all">
                        <i class="fa-brands fa-whatsapp text-lg"></i>
                        <span>WhatsApp Support</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- SHOP & SERVICES CATEGORY BAR -->
        <nav class="bg-gray-950 border-b border-gray-800 py-3">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-3 overflow-x-auto no-scrollbar">
                <button class="cat-pill active whitespace-nowrap bg-accent text-black px-4 py-1.5 rounded-full text-xs font-bold transition-all" data-category="all">All Gear & Services</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="photography">Photography</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="videography">Videography</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="audio">Pro Audio</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="lighting">Lighting</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-gray-300 hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-gray-800" data-category="computer">Computers & Tech</button>
                <button class="cat-pill whitespace-nowrap bg-cardBg text-accent hover:text-white px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-accent/40 bg-accent/10" data-category="packages">✨ Event Packages</button>
            </div>
        </nav>

        <!-- PRODUCTS / PACKAGES GRID SECTION -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="flex items-center justify-between mb-8">
                <h1 id="section-title" class="text-2xl font-black uppercase tracking-wide text-white">Featured Equipment & Production Packages</h1>
                <button id="open-admin-btn" class="text-xs text-gray-400 hover:text-accent border border-gray-800 px-3 py-1.5 rounded-lg transition-colors">
                    <i class="fa-solid fa-lock mr-1"></i> Admin Panel
                </button>
            </div>

            <!-- Dynamic Grid -->
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Populated via script below -->
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="bg-darkBg border-t border-gray-800 py-10 mt-16 text-center text-sm text-gray-500">
        <p>© 2026 Nyirikamera E-Commerce & Media Production. Kigali, Rwanda.</p>
    </footer>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-700 w-full max-w-2xl rounded-3xl p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-6">
                <h3 class="text-lg font-black text-white">Admin Management</h3>
                <button id="close-admin-btn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="add-product-form" class="space-y-4 mb-6 bg-gray-950 p-4 rounded-2xl border border-gray-800">
                <h4 class="text-accent font-bold text-xs uppercase">Add New Product or Package</h4>
                <input type="text" id="p-title" required placeholder="Title (e.g. Platinum Wedding Coverage)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="p-price" required placeholder="Price (e.g. 1,200,000 RWF)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="p-oldprice" placeholder="Old Price / Value (optional)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <select id="p-category" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="packages">✨ Event Package</option>
                        <option value="photography">Photography</option>
                        <option value="videography">Videography</option>
                        <option value="audio">Pro Audio</option>
                        <option value="lighting">Lighting</option>
                        <option value="computer">Computer</option>
                    </select>
                    <input type="text" id="p-discount" placeholder="Badge Tag (e.g. Best Seller)" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="text" id="p-stock" placeholder="Subtitle / Turnaround" class="bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white">
                </div>
                <button type="submit" class="w-full bg-accent text-black font-bold py-2.5 rounded-xl text-sm">Save & Publish</button>
            </form>
            <div id="admin-inventory-list" class="space-y-2 max-h-48 overflow-y-auto"></div>
        </div>
    </div>

    <!-- EMBEDDED SCRIPT -->
    <script>
        const defaultProducts = [
            { id: 1, title: "Sony a7 IV Mirrorless Camera", category: "photography", price: "2,400,000 RWF", oldPrice: "2,500,000 RWF", discount: "-2%", stock: "1 in Stock", icon: "fa-camera" },
            { id: 2, title: "Sony FX30 Digital Cinema Camera", category: "videography", price: "2,350,000 RWF", oldPrice: "3,000,000 RWF", discount: "-3%", stock: "1 in Stock", icon: "fa-video" },
            { id: 3, title: "Shure SM7B Professional Microphone", category: "audio", price: "290,000 RWF", oldPrice: "500,000 RWF", discount: "-2%", stock: "2 in Stock", icon: "fa-microphone" },
            { id: 4, title: "Godox AD300Pro Outdoor Flash", category: "lighting", price: "700,000 RWF", oldPrice: "900,000 RWF", discount: "-3%", stock: "1 in Stock", icon: "fa-bolt" },
            // Event Packages
            { id: 101, title: "Gold Wedding Production Package", category: "packages", price: "1,500,000 RWF", oldPrice: "1,800,000 RWF", discount: "Most Popular", stock: "Full Day Coverage", icon: "fa-ring" },
            { id: 102, title: "Concert & Live Stage Multi-Cam Package", category: "packages", price: "2,200,000 RWF", oldPrice: "2,500,000 RWF", discount: "Pro Setup", stock: "3 Cameras + Live Feed", icon: "fa-sliders" },
            { id: 103, title: "Music Video Shoot & Cinematic Edit", category: "packages", price: "850,000 RWF", oldPrice: "1,000,000 RWF", discount: "Director's Pick", stock: "4K Cinema Production", icon: "fa-film" },
            { id: 104, title: "Corporate Event & Seminar Package", category: "packages", price: "600,000 RWF", oldPrice: "750,000 RWF", discount: "Standard", stock: "Photo + Highlight Video", icon: "fa-briefcase" }
        ];

        function getProducts() {
            const stored = localStorage.getItem('nyirikamera_products');
            if (!stored || stored === "[]") {
                localStorage.setItem('nyirikamera_products', JSON.stringify(defaultProducts));
                return defaultProducts;
            }
            try {
                return JSON.parse(stored);
            } catch (e) {
                localStorage.setItem('nyirikamera_products', JSON.stringify(defaultProducts));
                return defaultProducts;
            }
        }

        function saveProducts(products) {
            localStorage.setItem('nyirikamera_products', JSON.stringify(products));
        }

        function renderProducts(category = 'all') {
            const grid = document.getElementById('product-grid');
            const titleElem = document.getElementById('section-title');
            if (!grid) return;

            const products = getProducts();
            grid.innerHTML = '';

            const filtered = (category === 'all' || category === 'All Gear') 
                ? products 
                : products.filter(p => p.category.toLowerCase() === category.toLowerCase());

            if (titleElem) {
                if (category === 'packages') {
                    titleElem.textContent = "Professional Event & Production Packages";
                } else if (category === 'all') {
                    titleElem.textContent = "Featured Equipment & Production Packages";
                } else {
                    titleElem.textContent = category.toUpperCase() + " GEAR & SERVICES";
                }
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-sm">No items found in this category. Click 'Admin Panel' above to add packages!</div>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-cardBg border border-gray-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between hover:border-gray-700 transition-all";
                card.innerHTML = `
                    <a href="product.html?id=${p.id}" class="block">
                        <div class="h-48 bg-gray-950 flex items-center justify-center relative">
                            <span class="absolute top-2.5 left-2.5 bg-accent/20 text-accent border border-accent/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full">${p.discount || 'Package'}</span>
                            <i class="fa-solid ${p.icon || 'fa-camera'} text-gray-700 text-5xl"></i>
                        </div>
                        <div class="p-4">
                            <span class="text-[10px] uppercase font-bold text-accent tracking-wider">${p.stock || 'Available'}</span>
                            <h3 class="text-sm font-bold text-white mt-1 mb-2 line-clamp-2 hover:text-accent transition-colors">${p.title}</h3>
                            <div class="flex items-center space-x-2">
                                <span class="text-base font-black text-accent">${p.price}</span>
                                ${p.oldPrice ? `<span class="text-xs text-gray-500 line-through">${p.oldPrice}</span>` : ''}
                            </div>
                        </div>
                    </a>
                    <div class="p-4 pt-0">
                        <a href="https://wa.me/250782815825?text=Hello%20Nyirikamera,%20I%20want%20to%20book%20or%20inquire%20about%20${encodeURIComponent(p.title)}" target="_blank"
                           class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center space-x-1.5 transition-all shadow-lg">
                            <i class="fa-brands fa-whatsapp text-sm"></i>
                            <span>Book via Whatsapp</span>
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAdminList() {
            const list = document.getElementById('admin-inventory-list');
            if (!list) return;
            const products = getProducts();
            list.innerHTML = '';
            
            if (products.length === 0) {
                list.innerHTML = `<div class="text-gray-500 text-xs text-center py-2">No inventory items.</div>`;
                return;
            }

            products.forEach(p => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-gray-900 p-2.5 rounded-xl border border-gray-800 text-xs';
                row.innerHTML = `
                    <span class="text-white font-medium">${p.title} (${p.category})</span>
                    <button data-id="${p.id}" class="del-btn bg-red-600/20 text-red-400 px-2 py-1 rounded-lg hover:bg-red-600 hover:text-white transition-colors">Delete</button>
                `;
                list.appendChild(row);
            });

            document.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    const updated = getProducts().filter(item => item.id !== id);
                    saveProducts(updated);
                    renderProducts(getCurrentCategory());
                    renderAdminList();
                });
            });
        }

        function getCurrentCategory() {
            const active = document.querySelector('.cat-pill.active');
            return active ? active.getAttribute('data-category') : 'all';
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.cat-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    document.querySelectorAll('.cat-pill').forEach(p => {
                        p.classList.remove('active', 'bg-accent', 'text-black', 'bg-accent/10');
                        p.classList.add('bg-cardBg', 'text-gray-300');
                    });
                    e.currentTarget.classList.remove('bg-cardBg', 'text-gray-300', 'bg-accent/10');
                    e.currentTarget.classList.add('active', 'bg-accent', 'text-black');
                    
                    const cat = e.currentTarget.getAttribute('data-category');
                    renderProducts(cat);
                });
            });

            const modal = document.getElementById('admin-modal');
            const openBtn = document.getElementById('open-admin-btn');
            const closeBtn = document.getElementById('close-admin-btn');

            if (openBtn) openBtn.addEventListener('click', () => { modal.classList.remove('hidden'); renderAdminList(); });
            if (closeBtn) closeBtn.addEventListener('click', () => modal.classList.add('hidden'));

            const form = document.getElementById('add-product-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newP = {
                        id: Date.now(),
                        title: document.getElementById('p-title').value,
                        price: document.getElementById('p-price').value,
                        oldPrice: document.getElementById('p-oldprice').value,
                        category: document.getElementById('p-category').value,
                        discount: document.getElementById('p-discount').value || 'Custom Package',
                        stock: document.getElementById('p-stock').value || 'Professional Setup',
                        icon: 'fa-ring'
                    };
                    const products = getProducts();
                    products.unshift(newP);
                    saveProducts(products);
                    form.reset();
                    renderProducts(getCurrentCategory());
                    renderAdminList();
                    alert('Package published successfully!');
                });
            }

            renderProducts('all');
        });
    </script>
</body>
</html>
